[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "global-currency"
version = "1.0.0"
description = "Historical and current currency conversion across active and legacy world currencies with multi-provider fallbacks and complete provenance."
readme = "README.md"
authors = [
    { name = "Global Currency Contributors" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0"
]
charts = [
    "matplotlib>=3.7.0"
]

[project.scripts]
global-currency = "global_currency.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
global_currency = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"


